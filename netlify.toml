# Designer Recruitment — static site, no build step.
# Netlify just publishes the repo root as-is.

[build]
  publish = "."
  command = ""

[build.environment]
  # Skip Puppeteer's Chromium download and dev-only tooling during install —
  # they're local dev utilities, not needed to publish the static site.
  PUPPETEER_SKIP_DOWNLOAD = "true"
  NPM_FLAGS = "--production"

# ---------------------------------------------------------------------------
# Internal documents — not for public serving
#
# publish = "." means every file committed to `main` is a public URL. That
# included the launch runbook (client and third-party contact details, the DNS
# baseline and the rollback procedures), CLAUDE.md, the audit prompt and the
# dev-only Node scripts. All were returning 200 in the wild.
#
# Nothing is deleted: the files stay in the repo. force = true makes these
# rules win over the static file that sits at the same path, so the URLs now
# return the site's own 404 page.
#
# Any new internal document belongs in /_studio-internal/, which is covered by
# the wildcard at the end of this block.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/LAUNCH-RUNBOOK.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SKILL.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/website-audit-prompt-v2.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/NETLIFY-DNS-BUILD-SHEET.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BRIEF-responsive-changes-pdf.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SHOT-LIST.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/screenshot.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_studio-internal/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Legacy URL redirects
#
# The previous site was WordPress. Its URLs used the WP convention of verbose
# hyphenated slugs (/about-us/, /contact-us/) where this site uses short ones
# (/about/, /contact/). Old links may still be indexed or bookmarked.
#
# /about-us/ is CONFIRMED — it was hit in the wild and returned a 404.
# The rest are high-confidence guesses at standard WordPress slugs. A rule for
# a path that never existed simply never fires, so the cost of a wrong guess is
# nil. Each pair covers the URL with and without a trailing slash.
#
# Replace guesses with real data once Google Search Console is reporting 404s.
# ---------------------------------------------------------------------------

# About — confirmed
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/about-us/"
  to = "/about/"
  status = 301

# Contact
[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/contact-us/"
  to = "/contact/"
  status = 301

# Team pages folded into About
[[redirects]]
  from = "/our-team"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/our-team/"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/meet-the-team"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/meet-the-team/"
  to = "/about/"
  status = 301

# Blog / news
[[redirects]]
  from = "/blog"
  to = "/news-and-insights/"
  status = 301
[[redirects]]
  from = "/blog/"
  to = "/news-and-insights/"
  status = 301
[[redirects]]
  from = "/news"
  to = "/news-and-insights/"
  status = 301
[[redirects]]
  from = "/news/"
  to = "/news-and-insights/"
  status = 301

# WordPress default legal-page slugs
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301
[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy.html"
