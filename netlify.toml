# Designer Recruitment — static site, no build step.
# Netlify just publishes the repo root as-is.

[build]
  publish = "."
  command = ""

[build.environment]
  # Skip Puppeteer's Chromium download and dev-only tooling during install —
  # they're local dev utilities, not needed to publish the static site.
  PUPPETEER_SKIP_DOWNLOAD = "true"
  NPM_FLAGS = "--production"

# ---------------------------------------------------------------------------
# Legacy URL redirects
#
# The previous site was WordPress. Its URLs used the WP convention of verbose
# hyphenated slugs (/about-us/, /contact-us/) where this site uses short ones
# (/about/, /contact/). Old links may still be indexed or bookmarked.
#
# /about-us/ is CONFIRMED — it was hit in the wild and returned a 404.
# The rest are high-confidence guesses at standard WordPress slugs. A rule for
# a path that never existed simply never fires, so the cost of a wrong guess is
# nil. Each pair covers the URL with and without a trailing slash.
#
# Replace guesses with real data once Google Search Console is reporting 404s.
# ---------------------------------------------------------------------------

# About — confirmed
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/about-us/"
  to = "/about/"
  status = 301

# Contact
[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/contact-us/"
  to = "/contact/"
  status = 301

# Team pages folded into About
[[redirects]]
  from = "/our-team"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/our-team/"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/meet-the-team"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/meet-the-team/"
  to = "/about/"
  status = 301

# Blog / news
[[redirects]]
  from = "/blog"
  to = "/news-and-insights/"
  status = 301
[[redirects]]
  from = "/blog/"
  to = "/news-and-insights/"
  status = 301
[[redirects]]
  from = "/news"
  to = "/news-and-insights/"
  status = 301
[[redirects]]
  from = "/news/"
  to = "/news-and-insights/"
  status = 301

# WordPress default legal-page slugs
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301
[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy.html"
  status = 301
[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms.html"
  status = 301
[[redirects]]
  from = "/terms-and-conditions/"
  to = "/terms.html"
  status = 301
[[redirects]]
  from = "/cookie-policy"
  to = "/cookies.html"
  status = 301
[[redirects]]
  from = "/cookie-policy/"
  to = "/cookies.html"
  status = 301

# ---------------------------------------------------------------------------
# Candidate login — FireFish jobs board
#
# The candidate portal lives on jobs.designerrecruitment.co.uk, a CNAME to
# FireFish that the DNS cutover preserved verbatim. It was never part of this
# site and was never taken down; the new build simply stopped linking to it.
#
# The old WordPress site had a login link in its nav, so its URL may still be
# bookmarked. These are guesses at the usual slugs — same reasoning as the
# legacy block above: a rule for a path that never existed never fires.
#
# Replace with real data once Search Console reports 404s.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/login"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/login/"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/candidate-login"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/candidate-login/"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/my-account"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/my-account/"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/sign-in"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
[[redirects]]
  from = "/sign-in/"
  to = "https://jobs.designerrecruitment.co.uk/login.aspx"
  status = 301
  force = true
